name: Update personal-master from upstream master and personal branches

on:
  workflow_dispatch:
  push:
    branches:
      - channel/fork-master
    paths:
      - .github/workflows/update-consolidated.yml

permissions:
  contents: write

env:
  PERSONAL_MASTER_BRANCH: channel/personal-master
  FEATURE_BRANCHES: |
    init/ocis_7-bin
    fix/babashka-deps-tools
    update/antora

jobs:
  update-personal-master:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Configure Git
        run: |
          git config --global user.name "Casey Link"
          git config --global user.email "14830+Ramblurr@users.noreply.github.com"

      - name: Add upstream remote and fetch branches
        run: |
          git remote add upstream https://github.com/NixOS/nixpkgs.git || true
          git fetch --no-tags upstream master
          git fetch --no-tags origin "${{ env.PERSONAL_MASTER_BRANCH }}"
          while IFS= read -r branch; do
            [[ -z "$branch" ]] && continue
            git fetch --no-tags origin "$branch"
          done <<< '${{ env.FEATURE_BRANCHES }}'

      - name: Rebuild personal-master branch from upstream snapshot
        run: |
          # Keep the generated branch usable as a channel, not as a literal history mirror.
          git checkout -B "${{ env.PERSONAL_MASTER_BRANCH }}" "origin/${{ env.PERSONAL_MASTER_BRANCH }}"

          git read-tree --reset -u upstream/master
          rm -rf .github/workflows

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "channel/personal-master: sync upstream master"
          fi

      - name: Apply feature branches
        run: |
          failed_branches=()

          while IFS= read -r branch; do
            [[ -z "$branch" ]] && continue

            base="$(git merge-base upstream/master "origin/$branch")"
            count="$(git rev-list --count "${base}..origin/${branch}")"

            if [[ "$count" == "0" ]]; then
              continue
            fi

            if ! git format-patch --stdout "${base}..origin/${branch}" | git am -3 --empty=drop; then
              echo "::error::Failed to apply $branch"
              git am --abort || true
              git reset --hard HEAD
              failed_branches+=("$branch")
            fi
          done <<< '${{ env.FEATURE_BRANCHES }}'

          if [ ${#failed_branches[@]} -gt 0 ]; then
            echo "::error::The following feature branches failed to layer into personal-master:"
            for branch in "${failed_branches[@]}"; do
              echo "::error::  - $branch"
            done
            exit 1
          fi

      - name: Push personal-master branch
        run: |
          git push origin "${{ env.PERSONAL_MASTER_BRANCH }}" --force
