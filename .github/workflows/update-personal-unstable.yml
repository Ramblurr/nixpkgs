name: Update personal-unstable from nixos-unstable with PRs

on:
  workflow_dispatch: # Allow manual triggering
  push:
    branches:
      - channel/fork-master
    paths:
      - .github/workflows/update-personal-unstable.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: channel/personal-unstable
  # List of PR URLs to apply (one per line)
  PR_URLS: ""

jobs:
  update-and-patch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Configure Git
        run: |
          git config --global user.name "Casey Link"
          git config --global user.email "14830+Ramblurr@users.noreply.github.com"

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/NixOS/nixpkgs.git || true
          git fetch --no-tags upstream nixos-unstable
          git fetch --no-tags origin "${{ env.TARGET_BRANCH }}"

      - name: Rebuild target branch from upstream snapshot
        run: |
          # Keep the generated branch usable as a channel, not as a literal history mirror.
          git checkout -B "${{ env.TARGET_BRANCH }}" "origin/${{ env.TARGET_BRANCH }}"

          deleted_paths="$(git diff --name-only --diff-filter=D HEAD..upstream/nixos-unstable || true)"

          git checkout upstream/nixos-unstable -- .
          rm -rf .github/workflows

          while IFS= read -r path; do
            [[ -z "$path" || "$path" == .github/workflows* ]] && continue
            git rm -r --ignore-unmatch -- "$path"
          done <<< "$deleted_paths"

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "channel/personal-unstable: sync upstream nixos-unstable"
          fi

      - name: Apply PR patches
        run: |
          failed_prs=()

          if [[ -z '${{ env.PR_URLS }}' ]]; then
            echo "No pull requests to apply!"
            exit 0
          fi

          while IFS= read -r pr_url; do
            [[ -z "$pr_url" ]] && continue

            if ! curl -fsSL "${pr_url}.patch" | git am -3 --empty=drop; then
              echo "::error::Failed to apply $pr_url"
              git am --abort || true
              failed_prs+=("$pr_url")
            else
              echo "Successfully applied $pr_url"
            fi
          done <<< '${{ env.PR_URLS }}'

          if [ ${#failed_prs[@]} -gt 0 ]; then
            echo "::error::The following PRs failed to apply:"
            for failed_pr in "${failed_prs[@]}"; do
              echo "::error::  - $failed_pr"
            done
            exit 1
          fi
      - name: Push patched branch
        run: |
          git push origin "${{ env.TARGET_BRANCH }}" --force
